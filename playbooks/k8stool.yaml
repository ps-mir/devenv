---
- name: Kubernetes tools setup
  hosts: localhost
  connection: local
  become: false
  gather_facts: true

  tasks:

    - name: Get installed kubectl version
      ansible.builtin.command: kubectl version --client --output=yaml
      register: kubectl_installed
      failed_when: false
      changed_when: false

    - name: kubectl (Linux x86_64)
      when:
        - ansible_facts["system"] == "Linux"
        - ansible_facts["architecture"] == "x86_64"
      block:

        - name: Get latest stable kubectl version
          ansible.builtin.uri:
            url: https://dl.k8s.io/release/stable.txt
            return_content: true
          register: kubectl_stable

        - name: Set kubectl version fact
          ansible.builtin.set_fact:
            kubectl_version: "{{ kubectl_stable.content | trim }}"

        - name: Download kubectl binary
          become: true
          when: kubectl_version not in (kubectl_installed.stdout | default(''))
          ansible.builtin.get_url:
            url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl"
            dest: /usr/local/bin/kubectl
            mode: "0755"
            force: true

        - name: kubectl version
          ansible.builtin.command: kubectl version --client --output=yaml
          register: kubectl_version_out
          changed_when: false

        - name: Show kubectl version
          ansible.builtin.debug:
            msg: "{{ (kubectl_version_out.stdout | from_yaml).clientVersion.gitVersion }}"

    - name: minikube (Linux x86_64)
      when:
        - ansible_facts["system"] == "Linux"
        - ansible_facts["architecture"] == "x86_64"
      block:

        - name: Get installed minikube version
          ansible.builtin.command: minikube version --short
          register: minikube_installed
          failed_when: false
          changed_when: false

        - name: Get latest minikube version
          ansible.builtin.uri:
            url: https://api.github.com/repos/kubernetes/minikube/releases/latest
            return_content: true
          register: minikube_latest

        - name: Set minikube version fact
          ansible.builtin.set_fact:
            minikube_version: "{{ (minikube_latest.content | from_json).tag_name }}"

        - name: Download minikube binary
          become: true
          when: minikube_version not in (minikube_installed.stdout | default(''))
          ansible.builtin.get_url:
            url: "https://github.com/kubernetes/minikube/releases/download/{{ minikube_version }}/minikube-linux-amd64"
            dest: /usr/local/bin/minikube
            mode: "0755"
            force: true

        - name: minikube version
          ansible.builtin.command: minikube version --short
          register: minikube_version_out
          changed_when: false

        - name: Show minikube version
          ansible.builtin.debug:
            msg: "{{ minikube_version_out.stdout }}"

    - name: kind (Linux x86_64)
      when:
        - ansible_facts["system"] == "Linux"
        - ansible_facts["architecture"] == "x86_64"
      block:

        - name: Get installed kind version
          ansible.builtin.command: kind version
          register: kind_installed
          failed_when: false
          changed_when: false

        - name: Get latest kind version
          ansible.builtin.uri:
            url: https://api.github.com/repos/kubernetes-sigs/kind/releases/latest
            return_content: true
          register: kind_latest

        - name: Set kind version fact
          ansible.builtin.set_fact:
            kind_version: "{{ (kind_latest.content | from_json).tag_name }}"

        - name: Download kind binary
          become: true
          when: kind_version not in (kind_installed.stdout | default(''))
          ansible.builtin.get_url:
            url: "https://storage.googleapis.com/k8s-staging-kind/latest/kind-linux-amd64"
            dest: /usr/local/bin/kind
            mode: "0755"
            force: true

        - name: kind version
          ansible.builtin.command: kind version
          register: kind_version_out
          changed_when: false

        - name: Show kind version
          ansible.builtin.debug:
            msg: "{{ kind_version_out.stdout }}"

    - name: act (Linux)
      when: ansible_facts["system"] == "Linux"
      become: true
      block:

        - name: Map architecture to act arch name
          ansible.builtin.set_fact:
            act_arch: "{{ {'x86_64': 'x86_64', 'aarch64': 'arm64'}[ansible_facts['architecture']] }}"

        - name: Download act tarball
          ansible.builtin.get_url:
            url: "https://github.com/nektos/act/releases/latest/download/act_Linux_{{ act_arch }}.tar.gz"
            dest: /tmp/act.tar.gz
            mode: "0644"
            force: true

        - name: Extract act binary
          ansible.builtin.unarchive:
            src: /tmp/act.tar.gz
            dest: /usr/local/bin
            include: [act]
            remote_src: true
            mode: "0755"

        - name: act version
          ansible.builtin.command: act --version
          register: act_version_out
          changed_when: false

        - name: Show act version
          ansible.builtin.debug:
            msg: "{{ act_version_out.stdout }}"
