---
- name: Base setup
  hosts: localhost
  connection: local
  become: false
  gather_facts: true

  tasks:

    - name: Install base utilities
      become: true
      when: ansible_facts["os_family"] == "Debian"
      ansible.builtin.apt:
        name: [jq]
        state: present

    - name: Check if docker is installed
      ansible.builtin.command: which docker
      register: docker_check
      failed_when: false
      changed_when: false

    - name: Docker (Debian)
      when:
        - ansible_facts["os_family"] == "Debian"
        - docker_check.rc != 0
      become: true
      block:

        - name: Set up Docker apt repo
          block:

            - name: Install prerequisites
              ansible.builtin.apt:
                name: [ca-certificates, curl]
                update_cache: true
                state: present

            - name: Create keyrings directory
              ansible.builtin.file:
                path: /etc/apt/keyrings
                state: directory
                mode: "0755"

            - name: Download Docker GPG key
              ansible.builtin.get_url:
                url: https://download.docker.com/linux/debian/gpg
                dest: /etc/apt/keyrings/docker.asc
                mode: "a+r"

            - name: Get dpkg architecture
              ansible.builtin.command: dpkg --print-architecture
              register: dpkg_arch
              changed_when: false

            - name: Add Docker apt repository
              ansible.builtin.copy:
                dest: /etc/apt/sources.list.d/docker.sources
                content: |
                  Types: deb
                  URIs: https://download.docker.com/linux/debian
                  Suites: {{ ansible_facts["distribution_release"] }}
                  Components: stable
                  Architectures: {{ dpkg_arch.stdout }}
                  Signed-By: /etc/apt/keyrings/docker.asc

            - name: Update apt cache after adding Docker repo
              ansible.builtin.apt:
                update_cache: true

        - name: Install Docker packages
          ansible.builtin.apt:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
              - docker-buildx-plugin
              - docker-compose-plugin
            state: present

    - name: Docker non-root access (Debian)
      when: ansible_facts["os_family"] == "Debian"
      become: true
      block:

        - name: Debug env user
          ansible.builtin.debug:
            msg: "Configuring Docker non-root access for user: {{ ansible_facts['env']['USER'] }}"

        - name: Create docker group
          ansible.builtin.group:
            name: docker
            state: present
          register: docker_group_result

        - name: Docker group status
          ansible.builtin.debug:
            msg: "{{ 'docker group created' if docker_group_result.changed else 'docker group already exists' }}"

        - name: Add user to docker group
          ansible.builtin.user:
            name: "{{ ansible_facts['env']['USER'] }}"
            groups: docker
            append: true
          register: docker_user_result

        - name: Docker user group status
          ansible.builtin.debug:
            msg: "{{ 'user ' + ansible_facts['env']['USER'] + ' added to docker group — reboot required.' if docker_user_result.changed else 'user ' + ansible_facts['env']['USER'] + ' already in docker group.' }}"

    - name: Copy .gitconfig
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../dotfiles/.gitconfig"
        dest: "{{ ansible_facts['env']['HOME'] }}/.gitconfig"
        force: true

    - name: Create ~/.devenv/scripts directory
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.devenv/scripts"
        state: directory
        mode: "0755"

    - name: Download git-prompt.sh
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/git/git/master/contrib/completion/git-prompt.sh
        dest: "{{ ansible_facts['env']['HOME'] }}/.devenv/scripts/git-prompt.sh"
        mode: "0644"
        force: false

    - name: Copy .bashrc_devenv.sh
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../dotfiles/.bashrc_devenv.sh"
        dest: "{{ ansible_facts['env']['HOME'] }}/.bashrc_devenv.sh"
        force: true

    - name: Source .bashrc_devenv.sh in ~/.bashrc
      ansible.builtin.blockinfile:
        path: "{{ ansible_facts['env']['HOME'] }}/.bashrc"
        create: true
        marker: "# {mark} DEVENV"
        block: |
          [ -f ~/.bashrc_devenv.sh ] && source ~/.bashrc_devenv.sh

    # ansible runs in a non-interactive shell so .bashrc is never loaded;
    # source ~/nvm.sh explicitly to check if nvm is installed and working.
    - name: Check if nvm is working
      ansible.builtin.shell:
        cmd: source ~/nvm.sh && nvm --version
        executable: /bin/bash
      register: nvm_check
      failed_when: false
      changed_when: false

    - name: nvm
      when: nvm_check.rc != 0
      block:

        - name: Get latest nvm release
          ansible.builtin.uri:
            url: https://api.github.com/repos/nvm-sh/nvm/releases/latest
            return_content: true
          register: nvm_release

        - name: Set nvm version fact
          ansible.builtin.set_fact:
            nvm_version: "{{ (nvm_release.content | from_json).tag_name }}"

        - name: Download and run nvm install script
          ansible.builtin.shell:
            cmd: "curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/{{ nvm_version }}/install.sh | bash"
            executable: /bin/bash
          environment:
            PROFILE: /dev/null

        - name: Copy nvm.sh
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../dotfiles/nvm.sh"
            dest: "{{ ansible_facts['env']['HOME'] }}/nvm.sh"
            force: true

    - name: Check if gh is installed
      ansible.builtin.command: which gh
      register: gh_check
      failed_when: false
      changed_when: false

    - name: GitHub CLI (Debian)
      when:
        - ansible_facts["os_family"] == "Debian"
        - gh_check.rc != 0
      become: true
      block:

        - name: Install wget
          ansible.builtin.apt:
            name: [wget]
            state: present

        - name: Create keyrings directory
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: "0755"

        - name: Download GitHub CLI GPG key
          ansible.builtin.get_url:
            url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
            dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
            mode: "a+r"

        - name: Get dpkg architecture
          ansible.builtin.command: dpkg --print-architecture
          register: gh_dpkg_arch
          changed_when: false

        - name: Add GitHub CLI apt repository
          ansible.builtin.copy:
            dest: /etc/apt/sources.list.d/github-cli.list
            content: "deb [arch={{ gh_dpkg_arch.stdout }} signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main\n"

        - name: Install gh
          ansible.builtin.apt:
            name: [gh]
            update_cache: true
            state: present

    - name: Check if claude is installed
      ansible.builtin.command: which claude
      register: claude_check
      failed_when: false
      changed_when: false

    - name: Install Claude Code
      when: claude_check.rc != 0
      ansible.builtin.shell:
        cmd: curl -fsSL https://claude.ai/install.sh | bash
        executable: /bin/bash

    - name: Check if fzf is installed
      ansible.builtin.command: which fzf
      register: fzf_check
      failed_when: false
      changed_when: false

    - name: fzf already installed, skipping
      when: fzf_check.rc == 0
      ansible.builtin.debug:
        msg: "fzf already installed, skipping"

    - name: Install fzf (Debian)
      when:
        - ansible_facts["os_family"] == "Debian"
        - fzf_check.rc != 0
      become: true
      ansible.builtin.apt:
        name: [fzf]
        state: present

    - name: Check if zoxide is installed
      ansible.builtin.command: which zoxide
      register: zoxide_check
      failed_when: false
      changed_when: false

    - name: zoxide already installed, skipping
      when: zoxide_check.rc == 0
      ansible.builtin.debug:
        msg: "zoxide already installed, skipping"

    - name: Install zoxide (Debian)
      when:
        - ansible_facts["os_family"] == "Debian"
        - zoxide_check.rc != 0
      become: true
      ansible.builtin.apt:
        name: [zoxide]
        state: present

    - name: Check if bazel is installed
      ansible.builtin.command: which bazel
      register: bazel_check
      failed_when: false
      changed_when: false

    - name: bazel already installed, skipping
      when: bazel_check.rc == 0
      ansible.builtin.debug:
        msg: "bazel already installed, skipping"

    # bazelisk installs itself as the `bazel` binary and transparently
    # downloads/runs the version pinned by a project's .bazelversion.
    - name: Install bazelisk as bazel (Debian)
      when:
        - ansible_facts["os_family"] == "Debian"
        - bazel_check.rc != 0
      become: true
      block:

        - name: Get latest bazelisk release
          ansible.builtin.uri:
            url: https://api.github.com/repos/bazelbuild/bazelisk/releases/latest
            return_content: true
          register: bazelisk_release

        - name: Set bazelisk version fact
          ansible.builtin.set_fact:
            bazelisk_version: "{{ (bazelisk_release.content | from_json).tag_name }}"

        - name: Get dpkg architecture
          ansible.builtin.command: dpkg --print-architecture
          register: bazelisk_dpkg_arch
          changed_when: false

        - name: Download bazelisk binary as bazel
          ansible.builtin.get_url:
            url: "https://github.com/bazelbuild/bazelisk/releases/download/{{ bazelisk_version }}/bazelisk-linux-{{ bazelisk_dpkg_arch.stdout }}"
            dest: /usr/local/bin/bazel
            mode: "0755"
