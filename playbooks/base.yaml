---
- name: Base setup
  hosts: localhost
  connection: local
  become: false
  gather_facts: true

  tasks:

    - name: Check if docker is installed
      ansible.builtin.command: which docker
      register: docker_check
      failed_when: false
      changed_when: false

    - name: Docker (Debian)
      when:
        - ansible_facts["os_family"] == "Debian"
        - docker_check.rc != 0
      become: true
      block:

        - name: Set up Docker apt repo
          block:

            - name: Install prerequisites
              ansible.builtin.apt:
                name: [ca-certificates, curl]
                update_cache: true
                state: present

            - name: Create keyrings directory
              ansible.builtin.file:
                path: /etc/apt/keyrings
                state: directory
                mode: "0755"

            - name: Download Docker GPG key
              ansible.builtin.get_url:
                url: https://download.docker.com/linux/debian/gpg
                dest: /etc/apt/keyrings/docker.asc
                mode: "a+r"

            - name: Get dpkg architecture
              ansible.builtin.command: dpkg --print-architecture
              register: dpkg_arch
              changed_when: false

            - name: Add Docker apt repository
              ansible.builtin.copy:
                dest: /etc/apt/sources.list.d/docker.sources
                content: |
                  Types: deb
                  URIs: https://download.docker.com/linux/debian
                  Suites: {{ ansible_facts["distribution_release"] }}
                  Components: stable
                  Architectures: {{ dpkg_arch.stdout }}
                  Signed-By: /etc/apt/keyrings/docker.asc

            - name: Update apt cache after adding Docker repo
              ansible.builtin.apt:
                update_cache: true

        - name: Install Docker packages
          ansible.builtin.apt:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
              - docker-buildx-plugin
              - docker-compose-plugin
            state: present

    - name: Docker non-root access (Debian)
      when: ansible_facts["os_family"] == "Debian"
      become: true
      block:

        - name: Debug env user
          ansible.builtin.debug:
            msg: "Configuring Docker non-root access for user: {{ ansible_facts['env']['USER'] }}"

        - name: Create docker group
          ansible.builtin.group:
            name: docker
            state: present
          register: docker_group_result

        - name: Docker group status
          ansible.builtin.debug:
            msg: "{{ 'docker group created' if docker_group_result.changed else 'docker group already exists' }}"

        - name: Add user to docker group
          ansible.builtin.user:
            name: "{{ ansible_facts['env']['USER'] }}"
            groups: docker
            append: true
          register: docker_user_result

        - name: Docker user group status
          ansible.builtin.debug:
            msg: "{{ 'user ' + ansible_facts['env']['USER'] + ' added to docker group — reboot required.' if docker_user_result.changed else 'user ' + ansible_facts['env']['USER'] + ' already in docker group.' }}"

    - name: Copy .gitconfig
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../dotfiles/.gitconfig"
        dest: "{{ ansible_facts['env']['HOME'] }}/.gitconfig"
        force: true

    - name: Create ~/.devenv/scripts directory
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.devenv/scripts"
        state: directory
        mode: "0755"

    - name: Download git-prompt.sh
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/git/git/master/contrib/completion/git-prompt.sh
        dest: "{{ ansible_facts['env']['HOME'] }}/.devenv/scripts/git-prompt.sh"
        mode: "0644"
        force: false

    - name: Copy .bashrc_devenv.sh
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../dotfiles/.bashrc_devenv.sh"
        dest: "{{ ansible_facts['env']['HOME'] }}/.bashrc_devenv.sh"
        force: true

    - name: Source .bashrc_devenv.sh in ~/.bashrc
      ansible.builtin.blockinfile:
        path: "{{ ansible_facts['env']['HOME'] }}/.bashrc"
        create: true
        marker: "# {mark} DEVENV"
        block: |
          [ -f ~/.bashrc_devenv.sh ] && source ~/.bashrc_devenv.sh
