---
- name: Go setup
  hosts: localhost
  connection: local
  become: false
  gather_facts: true

  tasks:

    - name: Get installed Go version
      ansible.builtin.command: go version
      register: go_installed
      failed_when: false
      changed_when: false

    - name: Go (Linux)
      when: ansible_facts["system"] == "Linux"
      block:

        - name: Map architecture to Go arch name
          ansible.builtin.set_fact:
            go_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] }}"

        - name: Get latest Go release
          ansible.builtin.uri:
            url: https://go.dev/dl/?mode=json
            return_content: true
          register: go_release

        - name: Set Go version fact
          ansible.builtin.set_fact:
            go_version: "{{ (go_release.content | from_json)[0].version }}"

        - name: Install Go
          when: go_version not in (go_installed.stdout | default(''))
          become: true
          block:

            - name: Download Go tarball
              ansible.builtin.get_url:
                url: "https://dl.google.com/go/{{ go_version }}.linux-{{ go_arch }}.tar.gz"
                dest: /tmp/go.tar.gz
                mode: "0644"
                force: true

            - name: Remove existing Go installation
              ansible.builtin.file:
                path: /usr/local/go
                state: absent

            - name: Extract Go
              ansible.builtin.unarchive:
                src: /tmp/go.tar.gz
                dest: /usr/local
                remote_src: true

        - name: Show Go version
          ansible.builtin.command: /usr/local/go/bin/go version
          register: go_version_out
          changed_when: false

        - name: Go version
          ansible.builtin.debug:
            msg: "{{ go_version_out.stdout }}"

        - name: Ensure precommit-sandbox directories exist
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: "0755"
          loop:
            - "{{ ansible_facts['env']['HOME'] }}/.local/share/precommit-sandbox"
            - "{{ ansible_facts['env']['HOME'] }}/.local/bin"

        - name: Install precommit-sandbox Dockerfile
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../dotfiles/precommit-sandbox/Dockerfile"
            dest: "{{ ansible_facts['env']['HOME'] }}/.local/share/precommit-sandbox/Dockerfile"
            mode: "0644"

        - name: Install precommit-sandbox script
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../dotfiles/precommit-sandbox/run.sh"
            dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/precommit-sandbox"
            mode: "0755"

        - name: Add ~/.local/bin to PATH in .bashrc_devenv.sh
          ansible.builtin.lineinfile:
            path: "{{ ansible_facts['env']['HOME'] }}/.bashrc_devenv.sh"
            line: '[ -d "$HOME/.local/bin" ] && export PATH=$PATH:$HOME/.local/bin'
            regexp: '\.local/bin'
            create: false
